# SwiftLint configuration for Antipodes.

included:
  - AntipodesKit/Sources
  - AntipodesKit/Tests
  - App

excluded:
  - .build
  - DerivedData

disabled_rules:
  # The codebase uses short, meaningful names for coordinates and maths (x, y, t).
  - identifier_name
  # SwiftUI view bodies are legitimately long; the view-splitting rule below covers it.
  - type_body_length

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

file_length:
  warning: 500
  error: 700

function_body_length:
  warning: 60
  error: 100

# Test fixture builders assemble a whole PlaceReference positionally.
function_parameter_count:
  warning: 10
  error: 14

# A (code, name, continent) triple reads better than a struct for test data.
large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

trailing_comma:
  mandatory_comma: true
